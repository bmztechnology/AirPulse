name: airpulse
description: AirPulse — Air Quality Monitor for Cyclists, Athletes & Sensitive Groups
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider:            ^6.1.1
  flutter_map:         ^6.1.0
  latlong2:            ^0.9.0
  fl_chart:            ^0.67.0
  shared_preferences:  ^2.2.2
  intl: ^0.20.2

  http:                        ^1.2.0
  geolocator:                  ^11.0.0
  share_plus:                  ^7.2.2
  path_provider:               ^2.1.2
  flutter_local_notifications: ^17.2.4
  flutter_secure_storage:      ^9.0.0
  get_it:                      ^7.6.7
  hive:                        ^2.2.3
  hive_flutter:                ^1.1.0
  connectivity_plus:           ^5.0.2
  shimmer:                     ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
