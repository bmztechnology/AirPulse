name: airpulse
description: AirPulse — Air Quality Monitor for Cyclists, Athletes & Sensitive Groups
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider:            ^6.1.1
  flutter_map:         ^6.1.0
  latlong2:            ^0.9.0
  fl_chart:            ^0.67.0
  shared_preferences:  ^2.2.2
  intl: ^0.20.2

  http:                        ^1.2.0
  geolocator:                  ^11.0.0
  share_plus:                  ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
