workflows:
  android-debug:
    name: Android Debug APK
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT"  >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate localizations
        script: flutter gen-l10n

      - name: Build Android Debug APK
        script: |
          flutter build apk \
            --debug \
            --no-tree-shake-icons \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list HEAD --count)))

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - bmztechnology@users.noreply.github.com
        notify:
          success: true
          failure: true
