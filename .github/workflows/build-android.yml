name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ─────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ── Keystore depuis Secret ───────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/airpulse-release.jks
          echo "✅ Keystore décodé"

      # ── Dépendances ─────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Build APK release signé ──────────────────────────────────────────
      - name: Build APK
        env:
          CM_KEYSTORE_PATH: ${{ github.workspace }}/android/app/airpulse-release.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=FLUTTER_BUILD_NUMBER=${{ github.run_number }}
          echo "✅ APK built"

      # ── Upload APK artifact ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airpulse-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Afficher infos APK ──────────────────────────────────────────────
      - name: APK info
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "📦 Taille: $(du -sh $APK | cut -f1)"
          echo "🔑 Signature:"
          keytool -printcert -jarfile $APK 2>/dev/null | grep -E "Owner|SHA256|Valid" || true
