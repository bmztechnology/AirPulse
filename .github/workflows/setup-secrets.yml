name: Setup Signing Secrets (run once)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      secrets: write
    steps:
      - name: Install PyNaCl
        run: pip install PyNaCl -q

      - name: Upload secrets via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json, urllib.request
          from nacl import encoding, public

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']

          # Récupérer la clé publique
          req = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/actions/secrets/public-key',
            headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          )
          with urllib.request.urlopen(req) as r:
            pk_data = json.loads(r.read())

          key_id  = pk_data['key_id']
          pub_key = public.PublicKey(pk_data['key'].encode(), encoding.Base64Encoder())

          def upload_secret(name, value):
            box = public.SealedBox(pub_key)
            enc = base64.b64encode(box.encrypt(value.encode())).decode()
            data = json.dumps({'encrypted_value': enc, 'key_id': key_id}).encode()
            req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/secrets/{name}',
              data=data, method='PUT',
              headers={
                'Authorization': f'token {token}',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              }
            )
            try:
              with urllib.request.urlopen(req) as r:
                print(f'  ✅ {name} (HTTP {r.status})')
            except Exception as e:
              print(f'  ❌ {name}: {e}')

          upload_secret('KEYSTORE_BASE64',   '')
          upload_secret('KEYSTORE_PASSWORD', 'AirPulse2024!')
          upload_secret('KEY_ALIAS',         'airpulse')
          upload_secret('KEY_PASSWORD',      'AirPulse2024!')
          PYEOF

      - name: Done
        run: |
          echo "✅ Secrets configurés"
          echo "Lance maintenant le workflow 'Build Android APK'"
